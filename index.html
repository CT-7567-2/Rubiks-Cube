<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubik’s Cube Simulation</title>
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1a;--panel:#fff;--line:#d6d6d0;--acc:#2a6df4;--accfg:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececea;--panel:#242628;--line:#3a3d40;--acc:#6b9bff;--accfg:#101418}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececea;--panel:#242628;--line:#3a3d40;--acc:#6b9bff;--accfg:#101418}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar label{display:flex;gap:6px;align-items:center}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#view{flex:1;min-height:0;position:relative;touch-action:none;user-select:none}
#view canvas{position:absolute;inset:0;display:block}
.ov{position:absolute;left:12px;font-size:13px;pointer-events:none;opacity:.85}
#status{top:8px;font-weight:600}
#hint{bottom:8px;max-width:90%}
#log{top:30px;max-width:90%;font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.7}
#not{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
</style>
</head>
<body>
<div class="bar">
  <label>Größe
    <select id="size"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
  </label>
  <button id="scr" class="p">Mischen</button>
  <button id="rst">Zurücksetzen</button>
  <select id="sol" aria-label="Lösungsalgorithmus"></select>
  <button id="slv">Lösen</button>
  <button id="und">Rückgängig</button>
  <label>Tempo <input type="range" id="spd" min="60" max="600" value="400"></label>
  <input id="not" type="text" placeholder="Notation: R U R' U'" size="18" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="play">Abspielen</button>
</div>
<div id="view">
  <div class="ov" id="status"></div>
  <div class="ov" id="log"></div>
  <div class="ov" id="hint">Auf den Würfel ziehen: Schicht drehen · Daneben ziehen: Ansicht drehen · Zoom: Mausrad oder Zwei-Finger-Geste · Tasten: R L U D F B (Shift = Gegenrichtung, Ziffer davor = tiefere Schicht), Pfeile = Ansicht, Leertaste = Mischen, Rücktaste = Rückgängig</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= Kernmodell (ohne Grafik) =================
   Würfel aus „Cubies“. Position p in verdoppelten Ganzzahl-Koordinaten (−(n−1) … n−1),
   Orientierung R als drei Spaltenvektoren. Ein Zug = (Achse 0/1/2, Schicht 0…n−1, Richtung ±1). */
const COL={"1,0,0":0xc41e3a,"-1,0,0":0xff5800,"0,1,0":0xffffff,"0,-1,0":0xffd500,"0,0,1":0x009b48,"0,0,-1":0x0045ad};
const rot=(v,a,d)=>{const[x,y,z]=v;
  if(a===0)return d>0?[x,-z,y]:[x,z,-y];
  if(a===1)return d>0?[z,y,-x]:[-z,y,x];
  return d>0?[-y,x,z]:[y,-x,z];};
class Cube{
  constructor(n){
    this.n=n;this.cubies=[];const m=n-1;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++){
      const p=[2*i-m,2*j-m,2*k-m],st=[];
      for(let a=0;a<3;a++)for(const s of[1,-1])if(p[a]===s*m){const v=[0,0,0];v[a]=s;st.push({n0:v,c:COL[v.join()]});}
      if(st.length)this.cubies.push({p,R:[[1,0,0],[0,1,0],[0,0,1]],st});
    }
  }
  inLayer(a,l){return this.cubies.filter(c=>c.p[a]===2*l-(this.n-1));}
  move(a,l,d){for(const c of this.inLayer(a,l)){c.p=rot(c.p,a,d);c.R=c.R.map(v=>rot(v,a,d));}}
  isSolved(){
    const seen={};
    for(const c of this.cubies)for(const s of c.st){
      const w=[0,1,2].map(i=>s.n0[0]*c.R[0][i]+s.n0[1]*c.R[1][i]+s.n0[2]*c.R[2][i]);
      const key=w.join();
      if(seen[key]===undefined)seen[key]=s.c;else if(seen[key]!==s.c)return false;
    }
    return true;
  }
}

/* ================= Solver-Schnittstelle =================
   Jeder Algorithmus: (cube, history) => Liste von Viertelzügen [[achse, schicht, richtung ±1], …]
   history = zusammengefasster Verlauf [[achse, schicht, 1 | 2 | -1], …] (nur für den Test-Solver gedacht)
   Neue Algorithmen einfach hier eintragen, sie erscheinen automatisch im Auswahlmenü. */
const Solvers={
  "Verlauf rückwärts (Test)":(cube,hist)=>cube.isSolved()?[]:
    hist.slice().reverse().flatMap(([a,l,t])=>t===2?[[a,l,1],[a,l,1]]:[[a,l,-t]])
};

/* ================= Darstellung (three.js) ================= */
const $=id=>document.getElementById(id);
const view=$("view"),statusEl=$("status");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
view.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,200),root=new THREE.Group();
scene.add(root);
const bodyGeo=new THREE.BoxGeometry(.98,.98,.98),bodyMat=new THREE.MeshBasicMaterial({color:0x151515});
const stGeo=new THREE.PlaneGeometry(.84,.84),stMats={};

let cube,history=[],queue=[],log=[],anim=null,count=0,speed=260,depth=1;
let yaw=.8,pitch=.5,zoom=1;

function place(c){
  const g=c.obj;g.position.set(c.p[0]/2,c.p[1]/2,c.p[2]/2);
  const[a,b,d]=c.R.map(v=>new THREE.Vector3(...v));
  g.setRotationFromMatrix(new THREE.Matrix4().makeBasis(a,b,d));
}
function build(n){
  while(root.children.length)root.remove(root.children[0]);
  cube=new Cube(n);history=[];queue=[];log=[];$("log").textContent="";anim=null;count=0;
  for(const c of cube.cubies){
    const g=new THREE.Group();c.obj=g;
    const b=new THREE.Mesh(bodyGeo,bodyMat);b.userData.c=c;g.add(b);
    for(const s of c.st){
      const mat=stMats[s.c]||(stMats[s.c]=new THREE.MeshBasicMaterial({color:s.c}));
      const m=new THREE.Mesh(stGeo,mat),nv=new THREE.Vector3(...s.n0);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),nv);
      m.position.copy(nv).multiplyScalar(.492);m.userData.c=c;g.add(m);
    }
    place(c);root.add(g);
  }
  updateCam();updateStatus();
}
function updateCam(){
  const asp=Math.max(.2,view.clientWidth/Math.max(1,view.clientHeight));
  camera.aspect=asp;
  const r=(cube.n*1.8+2.5)*Math.max(1,1.1/asp)*zoom;
  camera.position.set(r*Math.cos(pitch)*Math.sin(yaw),r*Math.sin(pitch),r*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(0,0,0);camera.updateProjectionMatrix();
}
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);updateCam();}
new ResizeObserver(resize).observe(view);

function updateStatus(){
  statusEl.textContent=`${cube.n}×${cube.n}×${cube.n} · Züge: ${count} · `+(depth>1?`Schicht ${depth} · `:"")+
    (anim||queue.length?"…":(cube.isSolved()?"gelöst ✓":"verdreht"));
}

/* Zugwarteschlange und Animation */
function start(m){
  const[a,l]=m,sel=cube.inLayer(a,l),pivot=new THREE.Group();
  root.add(pivot);for(const c of sel)pivot.add(c.obj);
  anim={m,sel,pivot,t0:performance.now(),dur:Math.max(50,speed/(1+queue.length/5))};
}
function finish(){
  const{m,sel,pivot}=anim,[a,l,d]=m;
  for(const c of sel)root.add(c.obj);
  root.remove(pivot);
  cube.move(a,l,d);for(const c of sel)place(c);
  addHist(a,l,d);
  if(cube.isSolved())history=[];
  if(!m[3])count++;
  log.push(notate(a,l,d));$("log").textContent=log.slice(-14).join(" ");
  anim=null;updateStatus();
}
function tick(t){
  requestAnimationFrame(tick);
  if(anim){
    const k=Math.min(1,(t-anim.t0)/anim.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    anim.pivot.rotation["xyz"[anim.m[0]]]=anim.m[2]*Math.PI/2*e;
    if(k>=1)finish();
  }else if(queue.length)start(queue.shift());
  renderer.render(scene,camera);
}

/* Bedienung: Kamera drehen, Schicht ziehen, Zoom */
const ray=new THREE.Raycaster(),ptrs=new Map();let drag=null,pinch=0;
const pdist=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])||1;};
function pick(e){
  const r=view.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),camera);
  const h=ray.intersectObjects(root.children,true)[0];
  if(!h||!h.object.userData.c)return null;
  return{c:h.object.userData.c,n:h.face.normal.clone().transformDirection(h.object.matrixWorld).round(),pt:h.point};
}
function layerMove(h,dx,dy){
  const na=[0,1,2].find(i=>h.n.getComponent(i)!==0);
  const proj=v=>{
    const p=h.pt.clone().project(camera),q=h.pt.clone().add(v).project(camera);
    return[(q.x-p.x)*view.clientWidth/2,-(q.y-p.y)*view.clientHeight/2];
  };
  let tAx=-1,sc=0;
  for(const t of[0,1,2]){
    if(t===na)continue;
    const e=new THREE.Vector3();e.setComponent(t,1);
    const s=proj(e),dt=(s[0]*dx+s[1]*dy)/(Math.hypot(s[0],s[1])||1);
    if(tAx<0||Math.abs(dt)>Math.abs(sc)){tAx=t;sc=dt;}
  }
  const u=[0,1,2].find(i=>i!==na&&i!==tAx);
  const uv=new THREE.Vector3(),tv=new THREE.Vector3();
  uv.setComponent(u,1);tv.setComponent(tAx,1);
  const d=Math.sign(sc)*Math.sign(uv.clone().cross(h.n).dot(tv));
  queue.push([u,(h.c.p[u]+cube.n-1)/2,d]);
  updateStatus();
}
view.addEventListener("pointerdown",e=>{
  view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){drag=null;pinch=pdist();return;}
  drag={x:e.clientX,y:e.clientY,hit:anim?null:pick(e),done:false};
});
view.addEventListener("pointermove",e=>{
  const prev=ptrs.get(e.pointerId);if(!prev)return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const d=pdist();zoom=Math.min(3,Math.max(.4,zoom*pinch/d));pinch=d;updateCam();return;}
  if(!drag)return;
  if(drag.hit){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.done&&Math.hypot(dx,dy)>14){drag.done=true;layerMove(drag.hit,dx,dy);}
  }else{
    yaw-=(e.clientX-prev[0])*.008;
    pitch=Math.min(1.5,Math.max(-1.5,pitch+(e.clientY-prev[1])*.008));updateCam();
  }
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)drag=null;};
view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);
view.addEventListener("wheel",e=>{
  e.preventDefault();zoom=Math.min(3,Math.max(.4,zoom*(e.deltaY>0?1.08:.92)));updateCam();
},{passive:false});

/* Notation und Tastatur: [Achse, Außenseite (1 = positive Seite), Richtung im Uhrzeigersinn] */
const FACE={R:[0,1,-1],L:[0,0,1],U:[1,1,-1],D:[1,0,1],F:[2,1,-1],B:[2,0,1]};
function faceMove(f,dp,inv){
  const[a,outer,dir]=FACE[f],n=cube.n;
  if(dp>n)return null;
  return[a,outer?n-dp:dp-1,inv?-dir:dir];
}
function notate(a,l,d){
  const n=cube.n,dp=n-l,dn=l+1,pos=dp<=dn,k=pos?dp:dn;
  const letter=pos?"RUF"[a]:"LDB"[a],cw=pos?-1:1;
  return(k>1?k:"")+letter+(d===cw?"":"'");
}
function parse(text){
  const out=[];
  for(const tok of text.replace(/[’‘`]/g,"'").trim().split(/\s+/).filter(Boolean)){
    const m=/^(\d?)([RLUDFB])(2|')?$/.exec(tok.toUpperCase());
    if(!m)return null;
    const mv=faceMove(m[2],+m[1]||1,m[3]==="'");
    if(!mv)return null;
    out.push(mv);if(m[3]==="2")out.push(mv);
  }
  return out;
}
function play(){
  const mv=parse($("not").value);
  if(!mv){statusEl.textContent="Ungültige Notation. Erlaubt: R L U D F B, optional mit ' oder 2, z. B. R U2 F'";return;}
  for(const m of mv)queue.push(m);
  updateStatus();
}
/* Verlauf: Einträge [Achse, Schicht, Viertelumdrehungen 1 | 2 | -1].
   Züge auf derselben Achse vertauschen miteinander und werden zusammengefasst (5× R = 1× R). */
function addHist(a,l,t){
  for(let i=history.length-1;i>=0&&history[i][0]===a;i--){
    if(history[i][1]===l){
      const s=((history[i][2]+t)%4+4)%4;
      if(s===0)history.splice(i,1);else history[i][2]=s===3?-1:s;
      return;
    }
  }
  history.push([a,l,t]);
}
function undo(){
  if(anim||queue.length||!history.length)return;
  const[a,l,t]=history[history.length-1];
  queue.push([a,l,t===2?-1:-t]);updateStatus();
}
addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.code;
  if(/^Digit[1-9]$/.test(c)){depth=+c.slice(5);updateStatus();return;}
  if(c.startsWith("Key")&&FACE[c[3]]){
    const mv=faceMove(c[3],depth,e.shiftKey);depth=1;
    if(mv)queue.push(mv);
    updateStatus();e.preventDefault();return;
  }
  let used=true;
  if(c==="ArrowLeft")yaw+=.15;
  else if(c==="ArrowRight")yaw-=.15;
  else if(c==="ArrowUp")pitch=Math.max(-1.5,pitch-.12);
  else if(c==="ArrowDown")pitch=Math.min(1.5,pitch+.12);
  else if(e.key==="+"||e.key==="=")zoom=Math.max(.4,zoom*.9);
  else if(e.key==="-")zoom=Math.min(3,zoom*1.1);
  else if(c==="Space")scramble();
  else if(c==="Backspace")undo();
  else used=false;
  if(used){e.preventDefault();updateCam();}
});
$("und").onclick=undo;
$("play").onclick=play;
$("not").addEventListener("keydown",e=>{if(e.key==="Enter")play();});
document.addEventListener("click",e=>{if(e.target.matches("button"))e.target.blur();});

/* Schaltflächen */
const rand=k=>Math.floor(Math.random()*k);
function scramble(){
  if(anim||queue.length)return;
  count=0;const n=cube.n,k=Math.max(20,n*10);let pa=-1,pl=-1;
  for(let i=0;i<k;i++){
    let a,l;do{a=rand(3);l=rand(n);}while(a===pa&&l===pl);
    pa=a;pl=l;queue.push([a,l,Math.random()<.5?1:-1,true]);
  }
  updateStatus();
}
for(const name of Object.keys(Solvers)){const o=document.createElement("option");o.textContent=name;$("sol").appendChild(o);}
$("size").onchange=e=>build(+e.target.value);
$("scr").onclick=scramble;
$("rst").onclick=()=>build(cube.n);
$("slv").onclick=()=>{
  if(anim||queue.length)return;
  for(const m of Solvers[$("sol").value](cube,history))queue.push(m);
  updateStatus();
};
$("spd").oninput=e=>{speed=660-(+e.target.value);};
speed=660-400;

build(3);resize();requestAnimationFrame(tick);
</script>
</body>
</html>
